name: MyLoAI Production Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  python-package:
    name: Python package validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Validate wheel and sdist names
        run: |
          ls -la dist/
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
      - name: Validate release payload exclusions
        run: |
          rm -rf _payload_check
          mkdir _payload_check
          python -m zipfile -e "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)" _payload_check
          python packaging/check-release-payload.py _payload_check

  linux-packages:
    name: Linux package definitions
    runs-on: ubuntu-latest
    needs: python-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate package metadata
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          assert data['project']['name'] == 'myloai-control-center'
          assert data['project']['version'] == '1.2.0'
          scripts = data['project']['scripts']
          assert scripts['myloai'] == 'locallama_gui.app:main'
          assert scripts['locallama-gui'] == 'locallama_gui.app:main'
          PY
      - name: Validate Debian and Arch definitions exist
        run: |
          test -f packaging/linux/debian/control
          test -f packaging/linux/debian/rules
          test -f packaging/linux/debian/myloai-launcher
          test -f packaging/linux/PKGBUILD
          test -f packaging/linux/myloai
          test -f packaging/linux/myloai.desktop
          test -f packaging/linux/myloai.1

  windows-package:
    name: Windows bundled build
    runs-on: windows-latest
    needs: python-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .
      - name: Build bundled application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "MyLoAI Control Center" -m locallama_gui

  macos-package:
    name: macOS bundled build
    runs-on: macos-14
    needs: python-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .
      - name: Build bundled application
        run: |
          pyinstaller --noconfirm --clean --windowed --name "MyLoAI Control Center" -m locallama_gui

  appimage:
    name: AppImage foundation
    runs-on: ubuntu-latest
    needs: python-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate portable package inputs
        run: |
          test -f pyproject.toml
          test -f packaging/linux/myloai.desktop
          test -f packaging/linux/myloai.1
