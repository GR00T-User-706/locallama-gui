name: MyLoAI Production Packaging

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  python-package:
    name: Python distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Validate wheel payload
        run: |
          rm -rf _payload_check
          mkdir _payload_check
          python -m zipfile -e "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)" _payload_check
          python packaging/check-release-payload.py _payload_check
      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: myloai-python-distributions
          path: dist/*
          if-no-files-found: error

  linux-packages:
    name: Linux packages
    runs-on: ubuntu-latest
    needs: python-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dh-python python3-all python3-setuptools python3-pip python3-venv
          python -m pip install pyinstaller
      - name: Build AppImage
        run: |
          curl -L --fail --retry 3 -o build-appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build-appimagetool
          mkdir -p build
          mv build-appimagetool build/appimagetool
          packaging/linux/appimage/build-appimage.sh
      - name: Build Debian package
        run: |
          cp -a packaging/linux/debian ./debian
          dpkg-buildpackage -us -uc -b
          mkdir -p dist/deb
          mv ../myloai_*.deb dist/deb/
      - name: Validate Linux release payloads
        run: |
          test -f dist/MyLoAI-Control-Center-1.2.0-x86_64.AppImage
          test -n "$(find dist/deb -type f -name '*.deb' -print -quit)"
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: myloai-linux-packages
          path: |
            dist/*.AppImage
            dist/deb/*.deb
          if-no-files-found: error

  windows-package:
    name: Windows installer
    runs-on: windows-latest
    needs: python-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install .
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: packaging\windows\build-installer.ps1
      - name: Validate Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\installer\*.exe
          if (-not $installer) { throw 'Windows installer was not produced.' }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: myloai-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  macos-package:
    name: macOS DMG
    runs-on: macos-14
    needs: python-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install .
      - name: Build macOS application and DMG
        run: packaging/macos/build-dmg.sh
      - name: Validate macOS DMG
        run: test -f dist/MyLoAI-Control-Center-1.2.0-macOS.dmg
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: myloai-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-package, linux-packages, windows-package, macos-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: myloai-*
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/**/*
