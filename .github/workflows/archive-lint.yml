name: Archive Lint

on:
  pull_request:
    paths:
      - 'archive/**'
      - 'llm_studio/**'
      - 'ollama_GUI/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'archive/**'
      - 'llm_studio/**'
      - 'ollama_GUI/**'
      - '.github/workflows/**'

jobs:
  legacy-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Lint archived Python trees (syntax check)
        run: |
          python -m compileall -q llm_studio
          python -m compileall -q ollama_GUI
