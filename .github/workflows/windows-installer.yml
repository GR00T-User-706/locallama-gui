name: Windows Native Installer

on:
  pull_request:
    paths:
      - 'locallama_gui/**'
      - 'pyproject.toml'
      - 'packaging/windows/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build application bundle
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm packaging/windows/locallama-gui.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import re; text=open('pyproject.toml', encoding='utf-8').read(); print(re.search(r'^version\\s*=\\s*\"([^\"]+)\"', text, re.MULTILINE).group(1))"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building LocalLama Control Center $version"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "packaging\windows\installer.iss"

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = 'dist\installer\LocalLama-Control-Center-Setup.exe'
          if (-not (Test-Path $installer)) {
            throw "Expected installer was not produced: $installer"
          }
          Get-Item $installer | Format-List FullName,Length

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalLama-Control-Center-Windows-Installer
          path: dist/installer/LocalLama-Control-Center-Setup.exe
          if-no-files-found: error
