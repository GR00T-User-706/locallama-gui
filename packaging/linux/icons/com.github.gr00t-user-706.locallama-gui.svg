  <path d="M267 89c20-1 35 9 43 26 26-3 49 12 54 38 27 5 43 25 40 51 23 10 35 31 30 56 17 14 22 36 14 56-8 18-21 28-39 34 3 25-10 47-33 56-8 3-17 5-26 4-8 20-27 34-49 34h-34V89z" fill="#0a1027" stroke="url(#right)" stroke-width="11" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M256 82V430" stroke="url(#ring)" stroke-width="9" stroke-linecap="round"/>
  <g fill="none" stroke="#18dfff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
